# =============================================================================
#  AMF Solid Edge Clean Up Automation - configuration
#  Normally you do NOT need to change anything here. Just drop a fresh
#  machine_ids.xlsx next to main.py and run:  python main.py
# =============================================================================

input:
  machine_ids_file: machine_ids.xlsx          # relative to this folder (or absolute path)
  # First matching header is used. If none match, the first column is used.
  serial_column_candidates: [machine_serials, machine_serial, SR_NO, serial_number, serial, machine_id, machine_ids]
  # Skip serials that already completed successfully in an earlier cycle
  # (STEP-2 "only new distinct serial numbers proceed"). Use --force to override.
  skip_already_completed: true

paths:
  myloadpoint: 'C:\myloadpoint'                       # Bluestar check-out root
  working_folder_name: 'AMF 3D Files - For Working'   # created inside current user's Documents
  documents_folder: ''                                # blank = current user's Documents (auto)
  downloads_folder: ''                                # blank = current user's Downloads (auto)
  reports_folder: reports                             # summary reports + history
  browser_profile: browser_profile                    # Chrome profile used by the automation (keeps Bluestar login)

vpn:                                   # Process-1 STEP-1 (most important)
  enabled: true
  adapter_description: PANGP           # GlobalProtect virtual adapter description contains this text
  check_interval_seconds: 15           # background monitor interval
  auto_reconnect: true                 # try clicking "Connect" in the GlobalProtect panel
  globalprotect_exe: 'C:\Program Files\Palo Alto Networks\GlobalProtect\PanGPA.exe'
  reconnect_timeout_seconds: 120       # wait this long after the auto "Connect" click
  manual_wait_minutes: 15              # then wait this long for the user to connect manually
  check_host: ''                       # optional extra reachability test, e.g. 'amf.operations.dynamics.com:443'

bluestar:
  url: 'https://amf.operations.dynamics.com/?cmp=ausa&mi=BlueStar_ProductListPage'
  client_exe: 'C:\Program Files\Bluestar5\Client\BlueStarClientServices.exe'   # started automatically if not running
  keep_chrome_open: true               # attach to the open Bluestar Chrome; start it once if closed, never close it
  chrome_debug_port: 9222              # port used to attach (start_chrome.bat uses the same)
  chrome_exe: ''                       # blank = auto-detect Google Chrome
  login_timeout_minutes: 10            # first run: time allowed to sign in inside the automation browser
  action_timeout_seconds: 60           # max wait for a page element / Bluestar response
  checkout:
    cad_system: SolidEdge              # "Select CAD system" pop-up choice
    force_full_checkout: true
    download_timeout_minutes: 180      # max time for one full 3D CAD check out
    stable_seconds: 90                 # folder must stop changing for this long = download complete
    no_activity_minutes: 10            # no file activity at all after check out -> stop waiting
    retries: 1                         # re-run check out once if VPN dropped during download
  download_2d_draft: true
  download_bom: true
  export_wait_minutes: 10              # 2D draft export / BOM export max wait

working_copy:
  clear_readonly: true                 # working copy is local only -> allow Solid Edge to save it
  backup_existing: true                # rename an existing working folder instead of overwriting it

solidedge:
  enabled: true
  close_document_after_serial: true
  save_cleaned_assembly: true          # save the cleaned .asm in the WORKING copy (never in myloadpoint)
  apply_part_style_recursive: false    # false = "Use Part Style" on top-level occurrences (as in the manual process)
  motor_face_style: Red                # Face style used for motors (Checkpoint-4)
  download_missing_from_bluestar: true # Checkpoint-2: fetch missing files from Bluestar automatically
  use_2d_draft_crosscheck: true        # optional re-verification against the 2D draft PDF text
  orientation_tolerance: 1.0           # Z extent may be up to this factor of max(X,Y) and still pass
  step_file_extension: .stp
  remove_laser_beams: true             # open laser sensor parts and delete the laser beam geometry
  laser_backup_folder: _laser_backup   # original part files are copied here (inside the working folder) first

classification:
  # Words are matched on whole words (case-insensitive) in name, file name, title,
  # category, keywords and parent assembly names.
  # ---- Motors (Checkpoint-4). The leading noun of the title (text before the first comma)
  # decides, e.g. "GMT-DR 2HP, 230/460-60, 76.37:1" -> motor, "MOTOR MOUNT, SEW" -> not a motor.
  motor_keywords: [MOTOR, GEARMOTOR, GEAR MOTOR, GEARED MOTOR, GEAR-MOTOR, MOTORREDUCER, MOTOR REDUCER,
                   SERVOMOTOR, SERVO MOTOR, SERVO MTR, SERVO, BRAKEMOTOR, BRAKE MOTOR, MTR, GMT, GMT-DR,
                   GEARBOX MOTOR]
  motor_exclude_words: [MOUNT, MOUNTING, BRACKET, PLATE, KIT, COVER, HOOD, GUARD, SEAL, BASE, ADAPTER, SPACER,
                        CABLE, CORD, SHIM, KEY, COUPLING, HUB, ARM, PULLEY, BELT, CHAIN, BUSHING, SPROCKET, STAND,
                        SUPPORT, DECAL, LABEL, BOX, SKID, SHAFT, CONTROLLER, STARTER, PROTECTOR, BREAKER, FUSE,
                        CONNECTOR, TERMINAL, SENSOR, ENCODER, CLAMP, WASHER, SCREW, BOLT, HARNESS, PLUG, OVERLOAD,
                        DISCONNECT, VFD, INVERTER, MOTOR DRIVE, MOTOR CONTROL, BRAKE PAD, SPACER, TORQUE ARM]
  motor_categories: [MOTORS]           # exact category names that hold motors (used with a power rating / no title)
  motor_part_numbers: []               # part numbers that are always motors (without extension)

  # ---- Protected components: never hidden by any cleanup rule (BOM, Reports/Parts List, ...)
  protected_categories: [SAFETY, STICKER, DECAL, NAMEPLATE, LABEL, ENCLOSURE, OPERATOR INTERFACE, ENCODER,
                         FASTENER, HARDWARE, SENSOR, PHOTO]   # category CONTAINS one of these
  protected_keywords: [SAFETY, DECAL, DECALS, STICKER, LABEL, LABELS, NAMEPLATE, WARNING, CAUTION, DANGER,
                       ENCLOSURE, ENCL, OPERATOR INTERFACE, HMI, OI, ENCODER, RESOLVER, BOLT, BOLTS, EYEBOLT,
                       EYE BOLT, CAPSCREW, CAP SCREW, SCREW, SCREWS, NUT, NUTS, LOCKNUT, WASHER, WASHERS, STUD,
                       RIVET, FASTENER, FASTENERS, ANCHOR, BELT, BELTS, REFLECTOR]   # leading noun of the title contains one of these
  # Sensor related parts and explicit phrases: matched ANYWHERE in the title (also sensor mounts / brackets)
  protected_title_words: ['MOUNT, PHOTOSWITCH', PHOTOSWITCH, PHOTO SWITCH, PHOTOEYE, PHOTO EYE, PHOTOCELL,
                          PHOTOELECTRIC, SENSOR, SENSORS, PROX, PROXIMITY, REFLECTOR, LIGHT CURTAIN, RIGHTSIGHT,
                          LASER PE, ENCODER]
  protected_exclude_words: [BEARING, GUIDE, SHAFT, ROLLER, BOLT-ON]
  protect_inside_hidden_assemblies: false   # true = keep protected children visible inside an assembly that is hidden

  # ---- Laser sensors (laser beam removal)
  laser_part_numbers: ['66135', '602317']   # confirmed laser sensors, always checked
  laser_keywords: [LASER]
  laser_sensor_words: [PE, PHOTOEYE, PHOTO EYE, PHOTOELECTRIC, SENSOR, DIFFUSE, RETRO, RETROREFLECTIVE, SCANNER,
                       DISTANCE, MEASURING, LIGHT BARRIER, LIGHT CURTAIN, SWITCH, DETECTOR, OPTICAL, BARRIER]
  laser_sensor_categories: [SENSOR, PHOTO]
  laser_exclude_words: [MOUNT, BRACKET, REFLECTOR, GUARD, CABLE, CORD, COVER, PLATE, HOLDER, CLAMP, DECAL, LABEL,
                        CONNECTOR, SHIELD, PROTECTOR, STAND, ARM]
  laser_beam_keywords: [BEAM, LASERBEAM, LASER BEAM, LASERSTRAHL, STRAHL, LICHTSTRAHL, LIGHT BEAM, LIGHTBEAM, RAY,
                        LASER RAY, LASER LINE, LASERLINE, LASER SPOT, LIGHT SPOT, LICHTFLECK, LASERPOINT, LASER POINT]
  electrical_keywords_strong:
    [ELECTRICAL, ELEC, ELECT, CABLE, CABLES, WIRE, WIRES, WIRING, HARNESS, CONNECTOR, CONNECTORS,
     ENCLOSURE, JUNCTION BOX, JBOX, J-BOX, CONTROL PANEL, ELECTRICAL PANEL, SENSOR, SENSORS,
     PROXIMITY, PROX, PHOTOEYE, PHOTO EYE, PHOTOCELL, ENCODER, E-STOP, ESTOP, EMERGENCY STOP,
     PUSHBUTTON, PUSH BUTTON, SELECTOR SWITCH, LIMIT SWITCH, SAFETY SWITCH, INTERLOCK, VFD,
     INVERTER, SERVO DRIVE, PLC, HMI, TERMINAL, TERMINALS, CONDUIT, CORD GRIP, CABLE GLAND,
     STACK LIGHT, STACKLIGHT, BEACON, SOLENOID, RELAY, CONTACTOR, CIRCUIT BREAKER, DISCONNECT,
     TRANSFORMER, POWER SUPPLY, CABLE TRAY, WIREWAY, RECEPTACLE, LIGHT CURTAIN, OPERATOR STATION]
  electrical_keywords_weak: [SWITCH, LIGHT, LAMP, PANEL, DRIVE, CONTROL, CONTROLS, POWER, CABINET, MOTOR, FAN, HEATER, BOX]
  electrical_categories: [ELEC, ELECTRICAL]
